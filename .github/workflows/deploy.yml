name: Deploy

# Deploys to the VPS only after CI passed on main (or manually from the Actions tab).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at the same time; a newer one waits for the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SHA,APP_DIR
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            git fetch --prune origin main
            git reset --hard "$SHA"
            bash ./deploy/deploy.sh
