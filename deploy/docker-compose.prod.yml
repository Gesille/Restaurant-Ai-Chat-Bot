# Production on a shared VPS: API + MongoDB on the same server.
# - The API listens on 127.0.0.1 only; the host's Caddy (shared by every project) terminates HTTPS.
# - MongoDB publishes NO port: it is reachable only by the API over this project's private Docker network.
# Secrets come from deploy/.env (Mongo passwords, generated by server-setup.sh) and deploy/.env.production.
name: restaurant-ai

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "1"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in deploy/.env}
      MONGO_APP_DB: ${MONGO_APP_DB:-restaurant_ai}
      MONGO_APP_USER: ${MONGO_APP_USER:-restaurant_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in deploy/.env}
    volumes:
      - mongo-data:/data/db
      - ./mongo/init-app-user.js:/docker-entrypoint-initdb.d/init-app-user.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  api:
    build: { context: .., dockerfile: Dockerfile }
    image: restaurant-ai-api:latest
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      mongo: { condition: service_healthy }
    # Reachable from the host (Caddy) only, never from the internet directly.
    ports: ["127.0.0.1:${API_PORT:-3000}:3000"]
    # The API needs no extra privileges: drop every Linux capability and forbid gaining new ones.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

volumes:
  mongo-data:
